<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Сообщения</title>
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/5/51/IMessage_logo.svg">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/5/51/IMessage_logo.svg">
    <style>
        :root {
            --bg-color: #000000;
            --bubble-sent: #34c759;
            --bubble-received: #26252a;
            --text-color: #ffffff;
            --secondary-text: #8e8e93;
            --link-blue: #2997ff;
            --glass-bg: rgba(30, 30, 35, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
            --red-color: #ff3b30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            user-select: none;
        }

        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        * {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            position: fixed;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            position: relative;
            background: #000000;
            overflow: hidden;
        }

        /* Экраны и плавная iOS-анимация */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: #000000;
            transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.38s ease;
            z-index: 1;
            width: 100%;
            height: 100%;
            will-change: transform, opacity;
        }

        .screen.no-transition {
            transition: none !important;
        }

        .screen.hidden-left {
            transform: translateX(-30%);
            opacity: 0.7;
            pointer-events: none;
        }

        .screen.hidden-right {
            transform: translateX(100%);
            pointer-events: none;
        }

        .screen.active {
            transform: translateX(0);
            opacity: 1;
            z-index: 10;
            pointer-events: auto;
        }

        /* Единый стиль аватарок «7000» с увеличенной иконкой человека */
        .avatar, .chat-header-avatar, .profile-avatar {
            position: relative;
            border-radius: 50%;
            /* richer gradient similar to reference image */
            background: linear-gradient(135deg, #2f2f31 0%, #3b3b3d 45%, #262628 100%);
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
            flex-shrink: 0;
            overflow: hidden;
        }

        .avatar {
            width: 48px;
            height: 48px;
        }

        .chat-header-avatar {
            width: 38px;
            height: 38px;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            margin-bottom: 4px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
        }

        /* subtle glint/oval inside avatar near the bottom to match reference */
        .avatar::after, .chat-header-avatar::after, .profile-avatar::after {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 12%;
            width: 70%;
            height: 26%;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Увеличенный размер самой иконки человека внутри аватара */
        .avatar svg, .chat-header-avatar svg, .profile-avatar svg {
            fill: #ffffff;
            width: 72%;
            height: 72%;
        }

        /* --- 1. ЭКРАН СПИСКА ЧАТОВ --- */
        /* Изначально шапка полностью прозрачная, без фона и размытия */
        .chats-header {
            position: sticky;
            top: 0;
            padding-top: calc(env(safe-area-inset-top) + 8px);
            padding-bottom: 10px;
            padding-left: 16px;
            padding-right: 16px;
            background: rgba(20, 20, 25, 0);
            backdrop-filter: blur(0px) saturate(100%);
            -webkit-backdrop-filter: blur(0px) saturate(100%);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0);
            z-index: 20;
            flex-shrink: 0;
            transition: background 0.1s linear, border-color 0.1s linear;
        }

        .chats-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            min-height: 38px;
        }

        /* Кнопки в шапке (вернуть фон для Edit и стилевую кнопку сортировки) */
        .edit-btn {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            padding: 8px 18px;
            min-height: 44px;
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 26px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.2px;
            z-index: 3;
        }

        .edit-btn:active {
            opacity: 0.95;
            transform: scale(0.99);
        }

        .filter-btn {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            z-index: 3;
        }

        .filter-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* Компактный заголовок по центру шапки (появляется с моушен блюром при скролле) */
        .compact-title-group {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            pointer-events: none;
            opacity: 0;
            filter: blur(10px);
            will-change: opacity, filter, transform;
            width: auto;
            max-width: calc(100% - 160px); /* reserve space for left/right buttons to avoid overlap on small screens */
            transition: opacity 180ms linear, filter 180ms linear, transform 180ms linear;
            overflow: hidden;
            word-wrap: break-word;
        }

        .compact-title-group .compact-main {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.05;
            color: #ffffff;
            text-shadow: 0 1px 0 rgba(0,0,0,0.4);
        }

        .compact-title-group .compact-sub {
            font-size: 12px; /* чуть уменьшили */
            color: #bdbdbf;
            font-weight: 500;
            line-height: 1.05;
            margin-top: 2px; /* сдвинуть вниз на пару пикселей */
        }

        .compact-title-group .compact-sub.muted {
            font-weight: 400;
            color: #a9a9ad;
        }

        /* Крупный заголовок под шапкой (внутри скролл-контейнера) */
        .large-title-container {
            padding: 4px 16px 6px 16px; /* reduced bottom padding to remove extra space under big letters */
            display: flex;
            flex-direction: column;
            gap: 2px;
            will-change: opacity, filter, transform;
            transition: opacity 180ms linear, filter 180ms linear, transform 180ms linear;
        }

        .large-title-container .chats-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            line-height: 1.1;
        }

        .large-title-container .icloud-status {
            font-size: 13px;
            color: #8e8e93;
            font-weight: 500;
            line-height: 1.2;
        }

        /* Small centered separator under the large title */
        .section-separator {
            width: 82%;
            height: 1px;
            background: rgba(255, 255, 255, 0.12);
            margin: 10px auto 8px auto;
            border-radius: 1px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding-bottom: 90px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            gap: 12px;
            cursor: pointer;
            position: relative;
        }

        .chat-item:active {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .unread-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #0a84ff;
            flex-shrink: 0;
            margin-left: -12px;
            opacity: 0;
        }

        .unread-dot.active {
            opacity: 1;
        }

        .chat-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
            min-width: 0;
        }

        .chat-item:last-child .chat-details {
            border-bottom: none;
        }

        .chat-header-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-name-group {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 16px;
            font-weight: 600;
        }

        .chat-time-group {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--secondary-text);
            font-size: 14px;
        }

        .chat-time-group svg {
            width: 7px;
            height: 11px;
            fill: none;
            stroke: var(--secondary-text);
            stroke-width: 2;
        }

        .chat-preview {
            color: var(--secondary-text);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .search-float-bar {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom) + 16px);
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border-radius: 28px;
            padding: 0; /* inner element handles padding */
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
            width: calc(100% - 56px);
            max-width: 760px;
            justify-content: center;
        }

        .search-bg {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 25px;
            padding: 0 12px; /* vertical sizing handled by explicit height */
            border: 0.5px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            flex: 1 1 auto;
            min-width: 0;
            height: 44px; /* make panel height explicit so compose icon can match it */
        }

        /* main magnifier on the left inside the glass - larger and white */
        .search-bg > svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            flex: 0 0 auto;
        }

        .search-bg input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            flex: 1 1 auto;
            min-width: 120px;
            margin: 0 6px;
        }

        .search-actions { display: none; }

        .search-action { display: none; }

        /* Microphone: no background, white icon (inside the glass) */
        .mic-action {
            background: transparent;
            border: none;
            padding: 6px;
            cursor: pointer;
            flex: 0 0 auto;
        }

        .mic-action svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* Compose/edit remains outside the glass */
        .compose-action {
            width: 42px;
            height: 36px;
            border-radius: 8px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            margin-left: 8px;
        }

        .compose-action .compose-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 0.5px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .compose-action .compose-icon svg { width: 18px; height: 18px; fill: #ffffff; }

        .search-action:active, .compose-action:active, .mic-action:active { transform: scale(0.98); opacity: 0.95; }

        /* --- 2. ЭКРАН ЧАТА --- */
        .chat-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* make header background transparent so chat doesn't have solid glass behind avatar/name */
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-bottom: none;
            padding-top: calc(env(safe-area-inset-top) + 8px);
            padding-bottom: 6px; /* reduced padding to remove extra space */
        }

        .header-top {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 2px;
            color: var(--link-blue);
            cursor: pointer;
        }

        .back-btn svg {
            width: 12px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .badge {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            padding: 2px 7px;
            border-radius: 12px;
            margin-left: 2px;
        }

        .contact-trigger {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 4px;
        }

        .contact-name-small {
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 3px;
            padding-left: 6px; /* nudge small text slightly right */
        }

        .contact-name-small svg {
            width: 5px;
            height: 8px;
            fill: none;
            stroke: #8e8e93;
            stroke-width: 2;
        }

        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .meta-info {
            text-align: center;
            margin-top: 4px;
            margin-bottom: 6px;
            background: transparent;
        }

        .meta-text {
            color: var(--secondary-text);
            font-size: 11px;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            width: 100%;
            animation: springPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.2);
            will-change: transform, opacity;
            transform-origin: bottom right;
        }

        .message-row.received {
            transform-origin: bottom left;
        }

        @keyframes springPop {
            0% { opacity: 0; transform: scale(0.85) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .message-row.sent { align-items: flex-end; }
        .message-row.received { align-items: flex-start; }

        .bubble {
            max-width: 78%;
            padding: 8px 13px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.32;
            letter-spacing: -0.2px;
            word-wrap: break-word;
            white-space: pre-line;
        }

        .bubble.sent {
            background-color: var(--bubble-sent);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .bubble.received {
            background-color: var(--bubble-received);
            color: #ffffff;
            border-bottom-left-radius: 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.05);
        }

        .blue-link { color: var(--link-blue); text-decoration: underline; }
        .underline-text { text-decoration: underline; }

        .input-bar {
            padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px) 10px;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: none !important;
        }

        .plus-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        .plus-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #8e8e93;
            stroke-width: 2.2;
        }

        .input-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 0.5px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 6px 8px 6px 14px;
            min-height: 36px;
        }

        .input-container input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
        }

        .input-container input::placeholder {
            color: #636366;
            font-size: 14px;
        }

        .mic-btn, .send-btn {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .mic-btn svg { width: 18px; height: 18px; fill: #8e8e93; }

        .send-btn {
            background: var(--bubble-sent);
            border-radius: 50%;
            display: none;
        }

        .send-btn svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.5;
        }

        /* --- 3. ЭКРАН ПРОФИЛЯ --- */
        #profileScreen {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(35px) saturate(190%);
            -webkit-backdrop-filter: blur(35px) saturate(190%);
            z-index: 20;
        }

        /* Overlay modifier for showing a screen over another without sliding the background */
        .screen.overlay {
            transform: translateY(0) !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            z-index: 40 !important;
            transition: opacity 280ms cubic-bezier(0.2,0.9,0.2,1), transform 280ms cubic-bezier(0.2,0.9,0.2,1);
        }

        /* When overlay is opening, slight upward motion can be applied by inline transform if desired */

        .profile-header {
            padding: calc(env(safe-area-inset-top) + 12px) 16px 8px 16px;
            display: flex;
            align-items: center;
        }

        .profile-back-btn {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 0.5px solid rgba(255, 255, 255, 0.15);
        }

        .profile-back-btn svg {
            width: 10px;
            height: 16px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .profile-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 40px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .profile-title-group {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease;
            padding: 4px 12px;
            border-radius: 8px;
        }

        .profile-title-group:active {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.05);
        }

        .profile-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-align: center;
        }

        .action-buttons-row {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            margin-bottom: 6px;
        }

        .action-circle-btn {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 0.5px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .action-circle-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .card-group {
            width: 100%;
            background: rgba(30, 30, 35, 0.45);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 0.5px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-row {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
            font-size: 16px;
        }

        .card-row:last-child {
            border-bottom: none;
        }

        .card-row-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .phone-label {
            font-size: 13px;
            color: var(--secondary-text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .recent-tag {
            background: rgba(255, 255, 255, 0.12);
            color: #8e8e93;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 4px;

    // Плавная трансформация заголовка СЛЕВА и динамическое размытие жидкого стекла
    const maxScroll = 50;

    chatListContainer.addEventListener('scroll', () => {
        const scrollTop = chatListContainer.scrollTop;
        const scrollThreshold = 42; // Дистанция скрытия большого текста
        const progress = Math.min(1, Math.max(0, scrollTop / scrollThreshold));

        // 1. Управление фоном и подложкой жидкого стекла шапки
        if (progress > 0) {
            const glassAlpha = 0.65 * progress;
            const blurAmount = 25 * progress;
            chatsHeader.style.background = `rgba(20, 20, 25, ${glassAlpha})`;
            chatsHeader.style.backdropFilter = `blur(${blurAmount}px) saturate(190%)`;
            chatsHeader.style.webkitBackdropFilter = `blur(${blurAmount}px) saturate(190%)`;
            chatsHeader.style.borderColor = `rgba(255, 255, 255, ${0.12 * progress})`;
        } else {
            // Когда сверху отображается большой текст — фона и блюра нет
            chatsHeader.style.background = 'rgba(20, 20, 25, 0)';
            chatsHeader.style.backdropFilter = 'blur(0px) saturate(100%)';
            chatsHeader.style.webkitBackdropFilter = 'blur(0px) saturate(100%)';
            chatsHeader.style.borderColor = 'rgba(255, 255, 255, 0)';
        }

        // 2. Эффект Motion Blur при размытии большого текста в скролле
        largeTitle.style.opacity = `${1 - progress}`;
        largeTitle.style.filter = `blur(${progress * 12}px)`;
        largeTitle.style.transform = `translateY(${ -progress * 8 }px)`;

        // 3. Эффект Motion Blur при появлении центрального текста в шапке — единый контролируемый блок
        compactTitle.style.opacity = `${progress}`;
        compactTitle.style.filter = `blur(${(1 - progress) * 12}px)`;
        // Небольшой сдвиг вверх при появлении для ощущения движения (motion)
        compactTitle.style.transform = `translate(-50%, calc(-50% - ${progress * 6}px))`;
    });

        return `<svg><use href="#ios-avatar-icon"/></svg>`;

    function renderChatList() {
        const chatsItemsWrapper = document.getElementById('chatsItemsWrapper');
        if (!chatsItemsWrapper) return;
        
        chatsItemsWrapper.innerHTML = '';
        chatsData.forEach(chat => {
            const item = document.createElement('div');
            item.className = 'chat-item';
            item.onclick = () => openChat(chat.id);

            item.innerHTML = `
                <div class="unread-dot ${chat.unread ? 'active' : ''}"></div>
                <div class="avatar">${getAvatarSVG()}</div>
                <div class="chat-details">
                    <div class="chat-header-line">

                    </div>
                    <div class="chat-preview">${chat.preview}</div>
                </div>
            `;
            chatsItemsWrapper.appendChild(item);
        });
    }

    // Открытие чата

        const chat = chatsData.find(c => c.id === chatId);
        if (!chat) return;

        currentChat = chat;
        chat.unread = false;
        renderChatList();

        chatHeaderName.textContent = chat.name;
        profileTitleName.textContent = chat.name;
        profilePhoneNumber.textContent = chat.name;

        chatHeaderAvatar.innerHTML = getAvatarSVG();
        profileAvatar.innerHTML = getAvatarSVG();

        if (chat.id === '7000') {
            toggleNumberTitle.style.pointerEvents = 'auto';
        } else {
            toggleNumberTitle.style.pointerEvents = 'none';
        }

        chatBody.innerHTML = `
            <div class="meta-info">

                <div class="meta-text">${chat.dateMeta || '22 июня 2025 г.'}</div>

        `;

            const row = document.createElement('div');
            row.className = `message-row ${m.type}`;
            row.innerHTML = `<div class="bubble ${m.type}">${m.html}</div>`;
            chatBody.appendChild(row);
        });

        resetInlineStyles(chatsListScreen, chatScreen);
        chatsListScreen.className = 'screen hidden-left';
        chatScreen.className = 'screen active';
        scrollToBottom();
    }

    function resetInlineStyles(...screens) {
        screens.forEach(s => {
            s.style.transform = '';
            s.style.opacity = '';
        });

        profileScreen.className = 'screen active overlay';
    });

    backToChatFromProfile.addEventListener('click', () => {
        // Close overlay profile and leave chat screen untouched
        resetInlineStyles(profileScreen);
        profileScreen.className = 'screen hidden-right';
        // ensure chatScreen remains active (no slide animation)
        if (!chatScreen.classList.contains('active')) chatScreen.className = 'screen active';
    });

    toggleNumberTitle.addEventListener('click', () => {
        if (!currentChat || currentChat.id !== '7000') return;
        const newNum = chatHeaderName.textContent === '7000' ? '7001' : '7000';
        chatHeaderName.textContent = newNum;
        profileTitleName.textContent = newNum;
        profilePhoneNumber.textContent = newNum;
    });

    // Жесты свайпа назад
    let touchStartX = 0;
    let touchStartY = 0;
    let isSwiping = false;
    let activeScreen = null;
    let backgroundScreen = null;
    let containerWidth = 0;

    appContainer.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;

        if (touchStartX <= 45) {
            if (profileScreen.classList.contains('active')) {
                activeScreen = profileScreen;
                backgroundScreen = chatScreen;
                isSwiping = true;
            } else if (chatScreen.classList.contains('active')) {
                activeScreen = chatScreen;
                backgroundScreen = chatsListScreen;
                isSwiping = true;
            }

            if (isSwiping) {
                containerWidth = appContainer.offsetWidth;
                activeScreen.classList.add('no-transition');
                backgroundScreen.classList.add('no-transition');
            }
        }
    }, { passive: true });

    appContainer.addEventListener('touchmove', (e) => {
        if (!isSwiping) return;

        const touch = e.touches[0];
        const deltaX = touch.clientX - touchStartX;
        const deltaY = touch.clientY - touchStartY;

        if (deltaX > 0 && Math.abs(deltaX) > Math.abs(deltaY)) {
            const translatePercent = (deltaX / containerWidth) * 100;
            const bgTranslatePercent = -30 + (deltaX / containerWidth) * 30;

            activeScreen.style.transform = `translateX(${translatePercent}%)`;
            backgroundScreen.style.transform = `translateX(${bgTranslatePercent}%)`;
            backgroundScreen.style.opacity = `${0.7 + (deltaX / containerWidth) * 0.3}`;
        }
    }, { passive: true });

    appContainer.addEventListener('touchend', (e) => {
        if (!isSwiping) return;
        isSwiping = false;

        const touch = e.changedTouches[0];
        const deltaX = touch.clientX - touchStartX;

        activeScreen.classList.remove('no-transition');
        backgroundScreen.classList.remove('no-transition');
        resetInlineStyles(activeScreen, backgroundScreen);

        if (deltaX > containerWidth * 0.25) {
            if (activeScreen === profileScreen) {
                profileScreen.className = 'screen hidden-right';
                chatScreen.className = 'screen active';
            } else if (activeScreen === chatScreen) {
                chatScreen.className = 'screen hidden-right';
                chatsListScreen.className = 'screen active';
            }
        } else {
            if (activeScreen === profileScreen) {
                profileScreen.className = 'screen active';
                chatScreen.className = 'screen hidden-left';
            } else if (activeScreen === chatScreen) {
                chatScreen.className = 'screen active';
                chatsListScreen.className = 'screen hidden-left';
            }
        }
    });

    const toggleNotify = document.getElementById('toggleNotify');
    toggleNotify.addEventListener('click', () => {
        toggleNotify.classList.toggle('active');
    });

    msgInput.addEventListener('input', () => {
        if (msgInput.value.trim().length > 0) {
            sendBtn.style.display = 'flex';
            micBtn.style.display = 'none';
        } else {
            sendBtn.style.display = 'none';
            micBtn.style.display = 'flex';
        }
    });

    function scrollToBottom() {
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function formatDate(date) {
        const d = String(date.getDate()).padStart(2, '0');
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const y = date.getFullYear();
        return `${d}.${m}.${y}`;
    }

    function formatTime(date) {
        const h = String(date.getHours()).padStart(2, '0');
        const m = String(date.getMinutes()).padStart(2, '0');
        return `${h}:${m}`;
    }

    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text || !currentChat) return;

        const userRow = document.createElement('div');
        userRow.className = 'message-row sent';
        userRow.innerHTML = `<div class="bubble sent">${text}</div>`;
        chatBody.appendChild(userRow);

        currentChat.messages.push({ type: 'sent', html: text });
        currentChat.preview = text;
        renderChatList();

        msgInput.value = '';
        sendBtn.style.display = 'none';
        micBtn.style.display = 'flex';
        scrollToBottom();

        if (currentChat.isInteractiveTickets) {
            setTimeout(() => {
                const procRow = document.createElement('div');
                procRow.className = 'message-row received';
                procRow.innerHTML = `<div class="bubble received">Vash zapros obrabatyvaetsea.</div>`;
                chatBody.appendChild(procRow);
                scrollToBottom();

                setTimeout(() => {
                    const ticketTime = new Date();
                    const afterHour = new Date(ticketTime.getTime() + 60 * 60 * 1000);

                    const dateStr = formatDate(ticketTime);
                    const startTimeStr = formatTime(ticketTime);
                    const endTimeStr = formatTime(afterHour);
                    const currentTicketNo = ticketCounter++;

                    const ticketHtml = `Electronnyi bilet no.<br><span class="blue-link">${currentTicketNo}</span><br>${dateStr}<br>Deistvitelen 1 chas (<span class="underline-text">s ${startTimeStr} do ${endTimeStr}</span>)<br>Tsena 7 MDL<br>Bortovoi nomer ${text}`;

                    const ticketRow = document.createElement('div');
                    ticketRow.className = 'message-row received';
                    ticketRow.innerHTML = `<div class="bubble received">${ticketHtml}</div>`;
                    chatBody.appendChild(ticketRow);

                    currentChat.messages.push({ type: 'received', html: ticketHtml });
                    currentChat.preview = `Electronnyi bilet no. ${currentTicketNo}...`;
                    renderChatList();
                    scrollToBottom();
                }, 800);

            }, 400);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    renderChatList();
    // Инициализация состояния шапки (установить правильный фон/блюр и заголовки)
    if (chatListContainer) chatListContainer.dispatchEvent(new Event('scroll'));

    // Align compact title vertically with the edit and filter buttons
    function alignCompactTitleWithButtons() {
        if (!compactTitle || !editBtnEl || !chatsTopBar) return;
        // Use the center of the edit button as the vertical anchor
        const topBarRect = chatsTopBar.getBoundingClientRect();
        const editRect = editBtnEl.getBoundingClientRect();
        const anchorCenter = editRect.top + editRect.height / 2;
        const relative = anchorCenter - topBarRect.top; // px from top of top-bar
        const verticalOffset = 6; // shift compact title slightly lower (px)
        compactTitle.style.top = `${relative + verticalOffset}px`;
    }

    // Run alignment now and on resize (and also after fonts/layout settle)
    alignCompactTitleWithButtons();
    window.addEventListener('resize', alignCompactTitleWithButtons);
    // small timeout to align after fonts load/layout
    setTimeout(alignCompactTitleWithButtons, 120);
</script>

</body>
